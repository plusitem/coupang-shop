<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>득템연구소 & 건강노트 | 추천 상품</title>
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#211E1A;
    --ink-soft:#5B564C;
    --line:#DEDACE;
    --tool-accent:#B45A24;
    --tool-accent-soft:#F0DFCB;
    --health-accent:#3E6B54;
    --health-accent-soft:#DCE8DF;
    --card-bg:#FFFFFF;
    --accent: var(--tool-accent);
    --accent-soft: var(--tool-accent-soft);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .header-serif{
    font-family: "Noto Serif KR", "Georgia", serif;
  }

  /* 상단 고지문 */
  .disclosure{
    background:var(--ink);
    color:#EDE8DC;
    text-align:center;
    font-size:12px;
    letter-spacing:0.02em;
    padding:8px 16px;
    line-height:1.5;
  }

  header.hero{
    max-width:1080px;
    margin:0 auto;
    padding:48px 24px 24px;
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:0.16em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:10px;
  }

  h1.title{
    font-size:clamp(28px, 4vw, 42px);
    line-height:1.25;
    margin:0 0 12px;
    font-weight:700;
  }

  p.subtitle{
    color:var(--ink-soft);
    font-size:16px;
    line-height:1.6;
    max-width:560px;
    margin:0;
  }

  /* 카테고리 탭 */
  nav.tabs{
    max-width:1080px;
    margin:32px auto 0;
    padding:0 24px;
    display:flex;
    gap:10px;
    border-bottom:1px solid var(--line);
  }

  .tab-btn{
    appearance:none;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    padding:14px 6px;
    margin-bottom:-1px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .tab-btn.active{
    color:var(--ink);
    border-bottom-color:var(--accent);
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:20px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 28px -14px rgba(33,30,26,0.28);
  }

  .card .thumb{
    aspect-ratio:1/1;
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .card .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .card .body{
    padding:16px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }

  .card .cat-chip{
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.04em;
  }

  .card .name{
    font-size:15px;
    line-height:1.45;
    font-weight:600;
    color:var(--ink);
    min-height:44px;
  }

  .card .price-row{
    margin-top:auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }

  .card .price{
    font-size:18px;
    font-weight:800;
    color:var(--ink);
  }

  .card .buy-btn{
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    padding:8px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  footer{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 60px;
    color:var(--ink-soft);
    font-size:12px;
    line-height:1.7;
    border-top:1px solid var(--line);
    padding-top:24px;
  }

  .hidden{ display:none; }

  .toolbar{
    max-width:1080px;
    margin:20px auto 0;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  #search-box{
    flex:1;
    min-width:200px;
    max-width:340px;
    font-family:inherit;
    font-size:14px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    color:var(--ink);
  }

  #search-box:focus{
    outline:2px solid var(--tool-accent);
    outline-offset:1px;
  }

  #sort-select{
    font-family:inherit;
    font-size:13px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    color:var(--ink-soft);
  }

  #page-size-select{
    font-family:inherit;
    font-size:13px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    color:var(--ink-soft);
  }

  .scroll-fab{
    position:fixed;
    right:20px;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:14px;
    cursor:pointer;
    box-shadow:0 6px 16px -6px rgba(33,30,26,0.3);
    z-index:20;
    display:none;
  }

  .scroll-fab:hover{
    background:var(--tool-accent-soft);
    color:var(--ink);
  }

  .scroll-fab.visible{ display:block; }

  @media (max-width:480px){
    .scroll-fab{ width:38px; height:38px; font-size:12px; right:14px; }
  }

  .count-label{
    font-size:12px;
    color:var(--ink-soft);
  }

  .more-wrap{
    display:flex;
    justify-content:center;
    margin-top:28px;
  }

  .more-btn{
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:12px 28px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.15s ease;
  }

  .more-btn:hover{
    background:var(--tool-accent-soft);
  }

  @media (max-width:480px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
    .card .name{ font-size:13.5px; min-height:36px; }
    .card .price{ font-size:15px; }
  }
</style>
</head>
<body>

<div class="disclosure">
  이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
</div>

<header class="hero">
  <div class="eyebrow header-serif">CURATED PICKS</div>
  <h1 class="title header-serif">득템연구소 &amp; 건강노트</h1>
  <p class="subtitle">20년 현장 경험과 자가 실험을 거쳐 써보고 고른 물건들도 있고, 편리하고 지금 인기 있는 아이템들도 함께 소개합니다.</p>
</header>

<nav class="tabs" id="tabs">
  <!-- 카테고리 탭은 구글 시트 데이터를 불러온 뒤 자동 생성됩니다 -->
</nav>

<div class="toolbar">
  <input type="text" id="search-box" placeholder="상품명 검색" oninput="handleSearch(this.value)">
  <select id="sort-select" onchange="handleSort(this.value)">
    <option value="newest">최신 등록순</option>
    <option value="price_asc">가격 낮은순</option>
    <option value="price_desc">가격 높은순</option>
    <option value="name">이름순</option>
  </select>
  <select id="page-size-select" onchange="handlePageSizeChange(this.value)">
    <option value="30">30개씩 보기</option>
    <option value="50">50개씩 보기</option>
    <option value="100">100개씩 보기</option>
    <option value="all">전체 보기</option>
  </select>
  <span id="count-label" class="count-label"></span>
</div>

<main>
  <section id="main-grid" class="grid"></section>
  <div id="more-wrap" class="more-wrap hidden">
    <button class="more-btn" onclick="loadMore()">더보기</button>
  </div>
</main>

<button id="scroll-top-btn" class="scroll-fab" style="bottom:76px;" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="맨 위로" aria-label="맨 위로">▲</button>
<button id="scroll-bottom-btn" class="scroll-fab" style="bottom:20px;" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})" title="맨 아래로" aria-label="맨 아래로">▼</button>

<footer>
  본 페이지의 상품 링크는 쿠팡 파트너스 활동을 통해 일정액의 수수료를 제공받을 수 있으며, 이는 쿠팡의 가격 정책과는 무관합니다.<br>
  상품 정보와 가격은 실제 쿠팡 페이지와 다를 수 있으니 구매 전 최종 확인 바랍니다.
</footer>

<script>
/* ============================================================
   상품 데이터를 구글 시트에서 실시간으로 불러옵니다.

   [설정 방법]
   1) 구글 시트를 새로 만들고, 첫 행(헤더)에 아래 5개 열 이름을 정확히 입력합니다.
      카테고리 | 상품명 | 가격 | 이미지 | 링크
   2) 그 아래로 상품을 한 줄씩 계속 추가하면 됩니다. (백 개, 천 개도 그대로 쌓으면 됩니다)
   3) 파일 > 공유 > 웹에 게시 (Publish to web) 클릭
   4) 문서 전체 대신 "특정 시트" 선택, 형식은 반드시 "쉼표로 구분된 값(.csv)" 선택
   5) 게시 후 나오는 링크를 아래 SHEET_CSV_URL 자리에 붙여넣습니다.

   시트를 연결하지 않으면 같은 폴더의 products.csv 파일을 대신 읽습니다.
   ============================================================ */
const SHEET_CSV_URL = ""; // 예: "https://docs.google.com/spreadsheets/d/e/2PACX-xxxx/pub?output=csv"
const LOCAL_CSV_FALLBACK = "products.csv";
const DEFAULT_PAGE_SIZE = 30; // 한 번에 보여줄 기본 카드 개수

let ALL_PRODUCTS = [];
let currentCat = null;
let currentQuery = "";
let currentSort = "newest";
let pageSize = DEFAULT_PAGE_SIZE;
let shownCount = DEFAULT_PAGE_SIZE;

function priceToNumber(priceStr){
  const n = parseInt((priceStr || "").replace(/[^0-9]/g, ""), 10);
  return isNaN(n) ? 0 : n;
}

function formatPrice(priceStr){
  const n = priceToNumber(priceStr);
  return n.toLocaleString('ko-KR') + '원';
}

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }

  const headers = rows.shift().map(h => h.trim());
  return rows
    .filter(r => r.some(v => v && v.trim()))
    .map(r => {
      const obj = {};
      headers.forEach((h, idx) => obj[h] = (r[idx] || "").trim());
      return {
        cat: obj["카테고리"] || "기타",
        name: obj["상품명"] || "",
        price: obj["가격"] || "",
        image: obj["이미지"] || "https://placehold.co/400x400/EDEAE0/999?text=No+Image",
        link: obj["링크"] || "#",
        regDate: obj["등록일"] || ""
      };
    })
    .filter(p => p.name && p.link !== "#");
}

async function loadProducts(){
  const source = SHEET_CSV_URL.trim() || LOCAL_CSV_FALLBACK;
  try {
    const res = await fetch(source, { cache: "no-store" });
    if (!res.ok) throw new Error("불러오기 실패: " + res.status);
    const text = await res.text();
    ALL_PRODUCTS = parseCSV(text);
  } catch (err){
    document.getElementById('main-grid').innerHTML =
      `<p style="grid-column:1/-1;color:#a33;">상품 목록을 불러오지 못했습니다. (${source})<br>구글 시트 게시 설정 또는 products.csv 파일 위치를 확인해 주세요.</p>`;
    console.error(err);
    return;
  }
  buildTabs();
  render();
}

const CATEGORY_THEMES = [
  { keywords: ['건강','헬스','영양','비타민','다이어트','노트'], icon: '🌿', accent: '#3E6B54', soft: '#DCE8DF' },
  { keywords: ['뷰티','미용','화장품','스킨'], icon: '💄', accent: '#B5576F', soft: '#F3DCE3' },
  { keywords: ['가전','전자','디지털'], icon: '🔌', accent: '#3A5F8A', soft: '#DCE6F0' },
  { keywords: ['공구','수리','도구'], icon: '🔧', accent: '#8A5A2E', soft: '#EDE0CF' },
  { keywords: ['주방','생활','잡화','득템'], icon: '🧺', accent: '#B45A24', soft: '#F0DFCB' }
];
const DEFAULT_THEME = { icon: '🛍️', accent: '#4A5A7A', soft: '#DFE4EE' };

function getCategoryTheme(catName){
  const hit = CATEGORY_THEMES.find(t => t.keywords.some(kw => catName.includes(kw)));
  return hit || DEFAULT_THEME;
}

function applyTheme(catName){
  const theme = catName === ALL_TAB ? DEFAULT_THEME : getCategoryTheme(catName);
  document.documentElement.style.setProperty('--accent', theme.accent);
  document.documentElement.style.setProperty('--accent-soft', theme.soft);
}

const ALL_TAB = '__all__';

function buildTabs(){
  const cats = [...new Set(ALL_PRODUCTS.map(p => p.cat))];
  currentCat = ALL_TAB;
  const nav = document.getElementById('tabs');

  const allBtn = `<button class="tab-btn active" data-cat="${ALL_TAB}" onclick="switchTab('${ALL_TAB}')">🗂️ 전체</button>`;
  const catBtns = cats.map(c => {
    const theme = getCategoryTheme(c);
    return `<button class="tab-btn" data-cat="${c}" onclick="switchTab('${c.replace(/'/g,"\\'")}')">${theme.icon} ${c}</button>`;
  }).join('');

  nav.innerHTML = allBtn + catBtns;
  applyTheme(currentCat);
}

function switchTab(cat){
  currentCat = cat;
  shownCount = pageSize;
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  applyTheme(cat);
  render();
}

function handleSearch(value){
  currentQuery = value.trim().toLowerCase();
  shownCount = pageSize;
  render();
}

function handleSort(value){
  currentSort = value;
  shownCount = pageSize;
  render();
}

function handlePageSizeChange(value){
  pageSize = value === 'all' ? Infinity : parseInt(value, 10);
  shownCount = pageSize;
  render();
  window.scrollTo({ top: document.getElementById('main-grid').offsetTop - 20, behavior: 'smooth' });
}

function loadMore(){
  shownCount += (pageSize === Infinity ? DEFAULT_PAGE_SIZE : pageSize);
  render();
}

function render(){
  const grid = document.getElementById('main-grid');
  const moreBtnWrap = document.getElementById('more-wrap');

  let list = currentCat === ALL_TAB ? [...ALL_PRODUCTS] : ALL_PRODUCTS.filter(p => p.cat === currentCat);
  if (currentQuery){
    list = list.filter(p => p.name.toLowerCase().includes(currentQuery));
  }

  list = [...list];
  if (currentSort === "price_asc"){
    list.sort((a, b) => priceToNumber(a.price) - priceToNumber(b.price));
  } else if (currentSort === "price_desc"){
    list.sort((a, b) => priceToNumber(b.price) - priceToNumber(a.price));
  } else if (currentSort === "name"){
    list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  } else {
    // newest: 등록일 내림차순, 등록일 없으면 원래 순서 유지
    list.sort((a, b) => (b.regDate || "").localeCompare(a.regDate || ""));
  }

  const visible = list.slice(0, shownCount);

  if (!visible.length){
    grid.innerHTML = `<p style="grid-column:1/-1;color:var(--ink-soft);">표시할 상품이 없습니다.</p>`;
    moreBtnWrap.classList.add('hidden');
    return;
  }

  grid.innerHTML = visible.map(p => `
    <a class="card" href="${p.link}" target="_blank" rel="noopener sponsored">
      <div class="thumb"><img src="${p.image}" alt="${p.name}" loading="lazy" referrerpolicy="unsafe-url" onerror="this.onerror=null;this.src='https://placehold.co/400x400/EDEAE0/999?text=No+Image';"></div>
      <div class="body">
        <span class="cat-chip">${getCategoryTheme(p.cat).icon} ${p.cat}</span>
        <span class="name">${p.name}</span>
        <div class="price-row">
          <span class="price">${formatPrice(p.price)}</span>
          <span class="buy-btn">쿠팡 보기</span>
        </div>
      </div>
    </a>
  `).join('');

  moreBtnWrap.classList.toggle('hidden', shownCount >= list.length);
  document.getElementById('count-label').textContent = `${list.length}개 중 ${visible.length}개 표시`;
}

loadProducts();

function updateScrollButtons(){
  const topBtn = document.getElementById('scroll-top-btn');
  const bottomBtn = document.getElementById('scroll-bottom-btn');
  const scrollY = window.scrollY;
  const nearBottom = window.innerHeight + scrollY >= document.body.scrollHeight - 40;

  topBtn.classList.toggle('visible', scrollY > 400);
  bottomBtn.classList.toggle('visible', scrollY > 200 && !nearBottom);
}

window.addEventListener('scroll', updateScrollButtons);
window.addEventListener('resize', updateScrollButtons);
updateScrollButtons();
</script>

</body>
</html>
